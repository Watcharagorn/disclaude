[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "disclaude"
version = "0.1.0"
description = "A standalone, self-hostable Discord <-> Claude chat engine."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "discord.py==2.7.1",
    "claude-agent-sdk==0.2.136",
]

[project.scripts]
disclaude = "disclaude.cli:main"

[tool.setuptools.packages.find]
include = ["disclaude*"]
